    zh: "匹配原生默认参数，并保留当前客户端的节点、车辆身份和装填机制。Mod 独有字段使用编辑前的值。共享组件仍会影响共同使用它的车辆。结果先存入缓存，再跟随全局保存。"
    en: "Restore matching native scalar defaults while preserving client structure, identities and loading mechanisms. Mod-only fields use pre-edit values. Shared components affect their listed users. Changes are cached before global Save."
