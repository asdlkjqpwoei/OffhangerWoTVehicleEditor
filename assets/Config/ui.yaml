    zh: "车辆改动已保存，重置所需的写入前文件已保留。"
    en: "Vehicle changes saved. Pre-edit files are retained for reset."
  Vehicle.ResetAllWarning:
    zh: "这会清除本编辑器的所有车辆改动，包括已保存到游戏的改动。已写入文件将恢复编辑前的原始字节，或移除编辑器新建的覆盖文件；不会整份覆盖原生包。若其他工具修改过这些文件，将拒绝回滚。已跟踪文件数量："
    en: "This clears every vehicle change tracked by this editor, including changes already saved to the game. It restores exact pre-edit files or removes editor-created overrides. Native packages are not replaced. External file changes block rollback. Tracked files: "
  Vehicle.ResetDone:
    zh: "本编辑器跟踪的缓存及已应用改动均已恢复。"
    en: "Tracked cached and applied changes have been restored."
