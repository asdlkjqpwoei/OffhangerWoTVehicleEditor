schema: 1
fallback_zh: "客户端原始参数。完整路径标明使用位置；同名参数可能用于不同物理或模式，修改不会自动联动。"
fallback_en: "Raw client parameter. The complete path identifies its use; equal names in different physics/modes remain independent."
fields:
  level:
    zh: "等级"
    en: "Tier"
    help_zh: "车辆等级；只改等级不自动改变分房、模块身份或注册编号。"
    help_en: "Vehicle tier; matchmaking and module identities are separate."
  price:
    zh: "货币价格"
    en: "Price"
    help_zh: "价格数值。金币或银币币种在车辆概要中单独设置，出售收益由客户端另外计算。"
    help_en: "Currency amount. Select gold or credits separately; sale income is calculated by the client."
  forward:
    zh: "最高前进速度"
    en: "Forward speed"
    help_zh: "最高前进速度。物理配置中的其他速度限制需要分别检查。"
    help_en: "Forward speed cap. Inspect the separate physics speed limits too."
  backward:
    zh: "最高后退速度"
    en: "Reverse speed"
    help_zh: "最高后退速度。不同模式或物理配置的同名限制独立保存。"
    help_en: "Reverse speed cap; limits for different physics modes are stored separately."
  moving:
    zh: "移动隐蔽系数"
    en: "Moving camouflage"
    help_zh: "移动时的基础隐蔽系数；越大通常越不容易被发现。"
    help_en: "Base moving concealment; larger generally reduces detection."
  still:
    zh: "静止隐蔽系数"
    en: "Stationary camouflage"
    help_zh: "静止时的基础隐蔽系数；最终还受距离、草丛、涂装与装备影响。"
    help_en: "Base stationary concealment; cover, distance, camouflage and equipment also apply."
  firePenalty:
    zh: "开火隐蔽保留系数"
    en: "Firing camouflage factor"
    help_zh: "开火后的隐蔽系数因子，通常越小开火时越容易被发现；不是额外隐蔽百分比。"
    help_en: "Concealment factor after firing; smaller usually means easier detection."
  camouflageBonus:
    zh: "涂装隐蔽加成"
    en: "Camouflage paint bonus"
    help_zh: "涂装提供的基础隐蔽加成，使用客户端原始系数。"
    help_en: "Base camouflage paint bonus in the client raw scale."
  crewXpFactor:
    zh: "乘员经验倍率"
    en: "Crew XP multiplier"
    help_zh: "乘员经验倍率；1.5 表示基础经验的 1.5 倍。"
    help_en: "Crew XP multiplier; 1.5 means 1.5 times base XP."
  premiumVehicleXPFactor:
    zh: "高级车辆经验额外系数"
    en: "Premium vehicle XP bonus"
    help_zh: "额外经验系数；0.1 通常表示额外 10%，不是 0.1 倍。"
    help_en: "Additional XP factor; 0.1 generally means an extra 10%, not a 0.1 multiplier."
  maxHealth:
    zh: "模块／车辆生命值"
    en: "Health"
    help_zh: "当前路径对应模块或车体的生命值；不同模块独立生效，必须大于零。"
    help_en: "Health for this module or hull; separate modules have separate values. Must be positive."
  maxRegenHealth:
    zh: "模块修复上限"
    en: "Repaired health limit"
    help_zh: "模块被修复后可恢复到的生命值上限；与最大生命值区分。"
    help_en: "Health limit after a damaged module is repaired."
  repairCost:
    zh: "维修成本系数"
    en: "Repair cost"
    help_zh: "该车辆或模块的维修价格／系数，含义由当前路径决定。"
    help_en: "Vehicle or module repair cost/factor, depending on the source path."
  repairTime:
    zh: "维修时间"
    en: "Repair time"
    help_zh: "模块维修耗时，数值越小通常修复越快。"
    help_en: "Module repair duration; lower generally repairs faster."
  weight:
    zh: "重量"
    en: "Weight"
    help_zh: "当前部件的质量，通常为千克；会影响推重比、承载与物理响应。"
    help_en: "Component mass, generally kilograms; affects power-to-weight, load and physics."
  rotationSpeed:
    zh: "转动速度"
    en: "Rotation speed"
    help_zh: "当前悬挂或炮塔的转动速度；车体与炮塔分别设置。"
    help_en: "Rotation speed for this chassis or turret; the two are independent."
  terrainResistance:
    zh: "地形阻力：硬／中／软"
    en: "Terrain resistance: hard/medium/soft"
    help_zh: "三个数依次对应硬、中、软地面；越小通常机动越好。其他物理配置中的对应项也应检查。"
    help_en: "Hard, medium and soft ground resistance. Smaller generally improves mobility. Inspect other physics copies too."
  brakeForce:
    zh: "制动力"
    en: "Brake force"
    help_zh: "制动作用力，影响减速与停车，过大会改变车辆物理表现。"
    help_en: "Braking force; affects deceleration and stopping."
  maxLoad:
    zh: "最大承载"
    en: "Maximum load"
    help_zh: "悬挂最大承载质量；需要容纳整车配置的总重量。"
    help_en: "Maximum chassis load; must accommodate the complete vehicle."
  vehicleMovement:
    zh: "车体移动扩圈系数"
    en: "Movement dispersion"
    help_zh: "移动引起的瞄准圈扩张系数；越小移动射击通常越稳定。"
    help_en: "Dispersion caused by vehicle movement; lower generally improves firing stability."
  vehicleRotation:
    zh: "车体转向扩圈系数"
    en: "Hull rotation dispersion"
    help_zh: "车体转向引起的瞄准圈扩张系数。"
    help_en: "Dispersion caused by hull rotation."
  turretRotation:
    zh: "炮塔转向扩圈系数"
    en: "Turret rotation dispersion"
    help_zh: "炮塔转向引起的瞄准圈扩张系数。"
    help_en: "Dispersion caused by turret rotation."
  power:
    zh: "发动机功率"
    en: "Engine power"
    help_zh: "发动机功率的原始配置值，通常为马力；详细物理中的功率也独立生效。"
    help_en: "Raw engine power, generally horsepower; detailed physics power is independent."
  fireProbability:
    zh: "发动机起火概率"
    en: "Engine fire probability"
    help_zh: "发动机受损时起火的概率，范围 0 到 1。"
    help_en: "Probability of engine fire after damage, between zero and one."
  smplEnginePower:
    zh: "详细物理发动机功率"
    en: "Detailed physics engine power"
    help_zh: "详细物理／简化驱动所用的功率副本；不会自动随主发动机功率修改。"
    help_en: "Separate power value used by detailed/simplified drive physics; not automatically linked to the main engine."
  smplFwMaxSpeed:
    zh: "详细物理前进极速"
    en: "Detailed physics forward speed"
    help_zh: "详细物理中的前进限速副本；应与期望的主速度限制一起检查。"
    help_en: "Separate forward speed limit in detailed physics."
  smplBkMaxSpeed:
    zh: "详细物理后退极速"
    en: "Detailed physics reverse speed"
    help_zh: "详细物理中的后退限速副本；按客户端原始值保存。"
    help_en: "Separate reverse speed limit in detailed physics, stored in the client raw scale."
  circularVisionRadius:
    zh: "观察距离"
    en: "View range"
    help_zh: "炮塔基础观察距离，通常为米；实际侦察还受视野上限、装备和目标隐蔽影响。"
    help_en: "Base turret view range, generally meters; spotting limits, equipment and concealment also apply."
  shotDispersionRadius:
    zh: "火炮精度／散布半径"
    en: "Gun dispersion radius"
    help_zh: "基础瞄准圈散布半径，通常描述 100 米处的精度；越小通常越准。"
    help_en: "Base dispersion radius, generally specified at 100 meters; smaller is more accurate."
  aimingTime:
    zh: "瞄准时间"
    en: "Aim time"
    help_zh: "基础瞄准时间参数，数值越小通常收圈越快。"
    help_en: "Base aiming-time parameter; smaller generally aims faster."
  reloadTime:
    zh: "装填时间"
    en: "Reload time"
    help_zh: "单次装填或弹匣整体装填耗时；具体取决于原生机制及所在路径。"
    help_en: "Reload duration for a round or complete magazine, depending on native mechanism and path."
  afterShot:
    zh: "开火后扩圈系数"
    en: "After-shot dispersion"
    help_zh: "射击后的瞄准圈扩张系数；越小通常更快恢复瞄准。"
    help_en: "Dispersion increase after firing; lower generally improves follow-up shots."
  whileGunDamaged:
    zh: "火炮受损扩圈系数"
    en: "Damaged gun dispersion"
    help_zh: "火炮损坏时的散布惩罚系数。"
    help_en: "Dispersion penalty when the gun is damaged."
  pitchLimits:
    zh: "俯角／仰角限制"
    en: "Gun depression/elevation limits"
    help_zh: "俯仰范围的原始向量。保持元素数量与次序，不同炮塔方位的限制可能另有条目。"
    help_en: "Raw gun pitch-limit vector. Keep component count/order; some turret directions have additional limits."
  minPitch:
    zh: "原始仰角曲线"
    en: "Minimum pitch"
    help_zh: "火炮俯仰角下限，单位和正负方向遵循当前定义。"
    help_en: "Lower gun pitch limit using the current definition scale and sign."
  maxPitch:
    zh: "原始俯角曲线"
    en: "Maximum pitch"
    help_zh: "火炮俯仰角上限；勿与俯角边界颠倒。"
    help_en: "Upper gun pitch limit; keep bounds in order."
  count:
    zh: "原生装填机制数量"
    en: "Native mechanism count"
    help_zh: "当前弹匣／连发机制的弹数。只允许修改已有机制，不会新增另一种装填方式。"
    help_en: "Count in the existing magazine/burst mechanism. Does not add or convert mechanisms."
  rate:
    zh: "弹匣／连发射速（发／分）"
    en: "Magazine/burst rate (rounds/min)"
    help_zh: "已有弹匣／连发机制的每分钟射速；客户端用 60 ÷ rate 换算两发之间的秒数，数值越大间隔越短。"
    help_en: "Rounds per minute in the native magazine/burst mechanism. The client computes the interval as 60 / rate seconds."
  reloadTimes:
    zh: "逐发装填时间"
    en: "Per-round reload times"
    help_zh: "现有自动再装填／双管机制的逐发装填时间，保持原有向量长度与顺序。"
    help_en: "Per-round reload times of the existing autoreload/double-gun mechanism; preserve vector length and order."
  intraClipReload:
    zh: "弹匣内射击间隔"
    en: "Intra-clip reload"
    help_zh: "弹匣内相邻炮弹之间的间隔。"
    help_en: "Interval between rounds within a magazine."
  burstShellCount:
    zh: "连发炮弹数量"
    en: "Burst shell count"
    help_zh: "已有连发机制的炮弹数量，不会添加连发机制。"
    help_en: "Round count for an existing burst mechanism."
  clipShellCount:
    zh: "弹匣炮弹数量"
    en: "Magazine shell count"
    help_zh: "已有弹匣机制的弹量，不会将单发炮转换为弹匣炮。"
    help_en: "Round count for an existing magazine; does not convert single-shot guns."
  maxAmmo:
    zh: "携带弹药上限"
    en: "Ammunition capacity"
    help_zh: "车辆可携带的总炮弹数量；与弹匣内弹数不同。"
    help_en: "Total ammunition capacity, separate from magazine capacity."
  piercingPower:
    zh: "穿透力"
    en: "Penetration"
    help_zh: "炮弹穿透力或距离衰减向量；保持原有元素数及顺序。"
    help_en: "Penetration or distance-falloff vector; preserve its component count and order."
  speed:
    zh: "炮弹／物理初速度"
    en: "Projectile/physics speed"
    help_zh: "当前路径的速度值；炮弹路径通常为初速度（米／秒），其他路径按原始单位解释。"
    help_en: "Speed at this path; projectile entries generally use meters per second."
  gravity:
    zh: "炮弹／物理重力参数"
    en: "Projectile/physics gravity"
    help_zh: "当前炮弹或物理模型使用的重力值；会影响弹道或物理表现。"
    help_en: "Gravity used by this projectile or physics model; affects trajectory or behavior."
  armor:
    zh: "平均生命伤害"
    en: "Average hitpoint damage"
    help_zh: "damage/armor 是对车辆生命值的平均伤害，不是装甲厚度。"
    help_en: "damage/armor is average hitpoint damage, not armor thickness."
  devices:
    zh: "模块伤害"
    en: "Module damage"
    help_zh: "炮弹对内部模块的基础平均伤害。"
    help_en: "Base average damage to internal modules."
  normalizationAngle:
    zh: "转正角度"
    en: "Normalization angle"
    help_zh: "炮弹命中装甲后的转正角度；角度越大通常越容易穿透斜面。"
    help_en: "Shell normalization angle after impact; larger generally helps against sloped armor."
  ricochetAngle:
    zh: "跳弹角度"
    en: "Ricochet angle"
    help_zh: "触发跳弹判定的入射角阈值，仍受炮弹类型与口径规则影响。"
    help_en: "Ricochet angle threshold; shell type and caliber rules also apply."
  explosionRadius:
    zh: "爆炸范围"
    en: "Explosion radius"
    help_zh: "高爆弹的爆炸半径，通常为米；不会自动改变伤害。"
    help_en: "Explosion radius, generally meters; does not automatically change damage."
  stunDuration:
    zh: "弹震持续时间"
    en: "Stun duration"
    help_zh: "弹震持续时间的基础参数或范围；仅对已有弹震机制的炮弹有效。"
    help_en: "Base stun duration or range for shells that already support stun."
  duration:
    zh: "持续时间"
    en: "Duration"
    help_zh: "当前机制的持续时间；参见完整路径确定是弹震还是其他效果。"
    help_en: "Effect duration; inspect the complete path to distinguish stun from other effects."
  damageFactor:
    zh: "伤害系数"
    en: "Damage factor"
    help_zh: "当前机制对伤害的比例系数，按原始尺度保存。"
    help_en: "Damage multiplier for this effect in the original scale."
  stun:
    zh: "弹震参数"
    en: "Stun parameter"
    help_zh: "已有弹震机制参数；不新增原本不存在的弹震结构。"
    help_en: "Parameter of an existing stun mechanism; does not add missing stun structures."
  isStun:
    zh: "是否启用已有弹震"
    en: "Existing stun enabled"
    help_zh: "启用／禁用客户端已有的弹震标记。"
    help_en: "Enables/disables the stun flag already present in the client definition."
  caliber:
    zh: "口径"
    en: "Caliber"
    help_zh: "炮弹口径，通常为毫米；影响部分穿透与跳弹规则。"
    help_en: "Shell caliber, generally millimeters; affects some penetration and ricochet rules."
  shotDispersionAngle:
    zh: "火炮精度／散布半径"
    en: "Gun dispersion radius"
    help_zh: "基础瞄准圈散布半径，通常描述 100 米处的精度；越小通常越准。"
    help_en: "Base dispersion radius, generally specified at 100 meters; smaller is more accurate."
  enginePower:
    zh: "发动机功率"
    en: "Engine power"
    help_zh: "发动机功率的原始配置值，通常为马力；详细物理中的功率也独立生效。"
    help_en: "Raw engine power, generally horsepower; detailed physics power is independent."
  forwardSpeed:
    zh: "最高前进速度"
    en: "Forward speed"
    help_zh: "最高前进速度。物理配置中的其他速度限制需要分别检查。"
    help_en: "Forward speed cap. Inspect the separate physics speed limits too."
  backwardSpeed:
    zh: "最高后退速度"
    en: "Reverse speed"
    help_zh: "最高后退速度。不同模式或物理配置的同名限制独立保存。"
    help_en: "Reverse speed cap; limits for different physics modes are stored separately."
  maxSpeed:
    zh: "最高前进速度"
    en: "Forward speed"
    help_zh: "最高前进速度。物理配置中的其他速度限制需要分别检查。"
    help_en: "Forward speed cap. Inspect the separate physics speed limits too."
  minSpeed:
    zh: "最高后退速度"
    en: "Reverse speed"
    help_zh: "最高后退速度。不同模式或物理配置的同名限制独立保存。"
    help_en: "Reverse speed cap; limits for different physics modes are stored separately."
  rotationSpeedLimit:
    zh: "转动速度"
    en: "Rotation speed"
    help_zh: "当前悬挂或炮塔的转动速度；车体与炮塔分别设置。"
    help_en: "Rotation speed for this chassis or turret; the two are independent."
  terrainResistanceFactors:
    zh: "地形阻力：硬／中／软"
    en: "Terrain resistance: hard/medium/soft"
    help_zh: "三个数依次对应硬、中、软地面；越小通常机动越好。其他物理配置中的对应项也应检查。"
    help_en: "Hard, medium and soft ground resistance. Smaller generally improves mobility. Inspect other physics copies too."
  autoreloadTimes:
    zh: "逐发装填时间"
    en: "Per-round reload times"
    help_zh: "现有自动再装填／双管机制的逐发装填时间，保持原有向量长度与顺序。"
    help_en: "Per-round reload times of the existing autoreload/double-gun mechanism; preserve vector length and order."
  intraBurstReload:
    zh: "弹匣内射击间隔"
    en: "Intra-clip reload"
    help_zh: "弹匣内相邻炮弹之间的间隔。"
    help_en: "Interval between rounds within a magazine."
  stunDurationFactor:
    zh: "弹震持续时间"
    en: "Stun duration"
    help_zh: "弹震持续时间的基础参数或范围；仅对已有弹震机制的炮弹有效。"
    help_en: "Base stun duration or range for shells that already support stun."
  stunDurationDamageFactor:
    zh: "伤害系数"
    en: "Damage factor"
    help_zh: "当前机制对伤害的比例系数，按原始尺度保存。"
    help_en: "Damage multiplier for this effect in the original scale."
  stunDurationRandomFactor:
    zh: "弹震持续时间"
    en: "Stun duration"
    help_zh: "弹震持续时间的基础参数或范围；仅对已有弹震机制的炮弹有效。"
    help_en: "Base stun duration or range for shells that already support stun."
  stunStartTime:
    zh: "持续时间"
    en: "Duration"
    help_zh: "当前机制的持续时间；参见完整路径确定是弹震还是其他效果。"
    help_en: "Effect duration; inspect the complete path to distinguish stun from other effects."
  gunPitchLimits:
    zh: "俯角／仰角限制"
    en: "Gun depression/elevation limits"
    help_zh: "俯仰范围的原始向量。保持元素数量与次序，不同炮塔方位的限制可能另有条目。"
    help_en: "Raw gun pitch-limit vector. Keep component count/order; some turret directions have additional limits."
  vehicleDamageFactor:
    zh: "伤害系数"
    en: "Damage factor"
    help_zh: "当前机制对伤害的比例系数，按原始尺度保存。"
    help_en: "Damage multiplier for this effect in the original scale."
  explosionRadiusFactor:
    zh: "爆炸范围"
    en: "Explosion radius"
    help_zh: "高爆弹的爆炸半径，通常为米；不会自动改变伤害。"
    help_en: "Explosion radius, generally meters; does not automatically change damage."
  fireStartingChance:
    zh: "发动机起火概率"
    en: "Engine fire chance"
    help_zh: "发动机受损后的起火概率，范围 0 到 1。"
    help_en: "Engine fire chance after damage, between zero and one."
  rollingFriction:
    zh: "详细物理滚动阻力"
    en: "Detailed physics rolling friction"
    help_zh: "该种地面在详细物理中的滚动阻力；越小通常滚阻越低。与主地形阻力独立。"
    help_en: "Rolling resistance for this ground type in detailed physics; lower generally reduces resistance. Independent of main terrain resistance."
  bulkHealthFactor:
    zh: "模块整体血量系数"
    en: "Module bulk-health factor"
    help_zh: "模块整体生命值计算所用的倍率；按当前客户端原始尺度保存。"
    help_en: "Multiplier used by the client for bulk module health."
  invisibilityFactorAtShot:
    zh: "该火炮开火隐蔽因子"
    en: "Gun firing concealment factor"
    help_zh: "当前火炮开火时使用的隐蔽因子；与车辆自身开火惩罚共同生效。"
    help_en: "Concealment factor for this gun when firing; combines with vehicle firing penalties."
  maxClimbAngle:
    zh: "最大爬坡角度"
    en: "Maximum climb angle"
    help_zh: "车辆可攀爬坡度限制；实际仍受动力、地形和详细物理影响。"
    help_en: "Climb-angle limit; power, ground and detailed physics still matter."
  turretYawLimits:
    zh: "炮塔／火炮水平射界"
    en: "Turret/gun yaw limits"
    help_zh: "水平转动射界的原始限制向量，保持元素数量与顺序。"
    help_en: "Raw horizontal arc limits; preserve component count and order."
  rpm_min:
    zh: "发动机最低转速"
    en: "Minimum engine RPM"
    help_zh: "发动机最低转速，需与最高转速保持合理顺序。"
    help_en: "Minimum engine RPM; keep it below the maximum."
  rpm_max:
    zh: "发动机最高转速"
    en: "Maximum engine RPM"
    help_zh: "发动机最高转速，影响驱动和发动机工作范围。"
    help_en: "Maximum engine RPM, affecting the drive working range."
  invisibilityBonus:
    zh: "装备隐蔽加成"
    en: "Equipment concealment bonus"
    help_zh: "当前装备对本车的隐蔽加成配置，可能是多等级向量。"
    help_en: "Concealment bonus overridden for this vehicle/equipment; can be a multi-grade vector."
  maxDistance:
    zh: "炮弹最大飞行距离"
    en: "Maximum projectile distance"
    help_zh: "炮弹最大有效飞行距离，超过后由客户端结束飞行。"
    help_en: "Maximum projectile travel distance before the client ends its flight."
  impactRadius:
    zh: "破片／冲击影响半径"
    en: "Spall/impact radius"
    help_zh: "该炮弹破片或冲击效果的影响半径。"
    help_en: "Impact radius for this shell spall/effect definition."
  coneAngle:
    zh: "破片锥角"
    en: "Spall cone angle"
    help_zh: "破片影响锥体的角度参数。"
    help_en: "Angle of the spall effect cone."
  minStunDuration:
    zh: "最短弹震时间"
    en: "Minimum stun duration"
    help_zh: "弹震持续时间的下限。"
    help_en: "Lower bound of stun duration."
  maxStunDuration:
    zh: "最长弹震时间"
    en: "Maximum stun duration"
    help_zh: "弹震持续时间的上限。"
    help_en: "Upper bound of stun duration."
  damageDurationRatio:
    zh: "伤害与弹震时间系数"
    en: "Damage/stun duration ratio"
    help_zh: "按造成伤害计算弹震时间的系数。"
    help_en: "Factor linking inflicted damage to stun duration."
  guaranteedStunDuration:
    zh: "固定弹震时长比例"
    en: "Guaranteed stun duration fraction"
    help_zh: "基础弹震时长中固定部分的比例，范围 0 到 1；0.4 表示 40%，不是 0.4 秒。"
    help_en: "Guaranteed fraction of base stun duration, from zero to one; 0.4 means 40%, not 0.4 seconds."
  dualGunChargeTime:
    zh: "双管齐射准备时间"
    en: "Double-gun salvo charge"
    help_zh: "原生双管齐射的准备时间，不会将单发炮转换为双管。"
    help_en: "Salvo charge duration for an existing double-gun mechanism."
  dualGunReloadCooldown:
    zh: "双管齐射装填冷却"
    en: "Double-gun reload cooldown"
    help_zh: "原生双管齐射后的装填冷却时间。"
    help_en: "Reload cooldown after a native double-gun salvo."
  dualGunSwitchTime:
    zh: "双管切炮时间"
    en: "Double-gun switching time"
    help_zh: "已有双管机制在两个炮管之间切换的时间。"
    help_en: "Switching duration between barrels of an existing double-gun mechanism."
  chargeTime:
    zh: "双管齐射准备时间"
    en: "Salvo charge time"
    help_zh: "原生双管齐射的准备时长，减小后更快完成蓄力。"
    help_en: "Charge duration of an existing double-gun salvo; lower charges faster."
  shootImpulse:
    zh: "双管射击冲量"
    en: "Salvo firing impulse"
    help_zh: "双管齐射产生的物理冲量；影响射击时的车体反应。"
    help_en: "Physical firing impulse of the native double-gun mechanism."
  reloadLockTime:
    zh: "齐射后装填锁定时间"
    en: "Post-salvo reload lock"
    help_zh: "双管齐射后不能开始装填的时长。"
    help_en: "Delay before reload can begin after a double-gun salvo."
  rateTime:
    zh: "双管射击切换间隔"
    en: "Double-gun firing interval"
    help_zh: "原生双管机制两次射击之间的间隔。"
    help_en: "Interval between shots of the native double-gun mechanism."
  chargeThreshold:
    zh: "双管蓄力触发阈值"
    en: "Double-gun charge threshold"
    help_zh: "双管蓄力判定使用的原始阈值；按当前客户端尺度保存。"
    help_en: "Raw threshold used by the existing double-gun charge logic."
  afterShotDelay:
    zh: "齐射后延迟"
    en: "Post-shot delay"
    help_zh: "原生机制在齐射后的延迟参数。"
    help_en: "Native mechanism delay following a salvo."
  preChargeIndication:
    zh: "蓄力预提示参数"
    en: "Pre-charge indication"
    help_zh: "双管蓄力预提示的原始时间／阈值参数。"
    help_en: "Raw timing/threshold parameter for pre-charge indication."
  hasStun:
    zh: "是否启用已有弹震"
    en: "Existing stun enabled"
    help_zh: "切换当前炮弹已有的弹震布尔标记，不添加弹震节点。"
    help_en: "Toggles the existing shell stun flag without adding nodes."
  damageDurationCoeff:
    zh: "伤害相关弹震时长系数"
    en: "Damage-dependent stun duration fraction"
    help_zh: "弹震持续时间中随造成伤害变化的比例系数，范围 0 到 1。"
    help_en: "Fraction of stun duration that depends on inflicted damage, from zero to one."
  stunRadius:
    zh: "弹震影响半径"
    en: "Stun radius"
    help_zh: "已有弹震效果的作用半径，按客户端原始距离单位保存。"
    help_en: "Radius of the existing stun effect in client distance units."
  stunFactor:
    zh: "弹震强度系数"
    en: "Stun factor"
    help_zh: "已有弹震效果的倍率，客户端要求不超过 1。"
    help_en: "Native stun-effect factor; the client requires it to be at most one."
  guaranteedStunEffect:
    zh: "固定弹震效果比例"
    en: "Guaranteed stun effect fraction"
    help_zh: "固定弹震效果的比例系数，范围 0 到 1。"
    help_en: "Guaranteed stun-effect fraction, from zero to one."
  damageEffectCoeff:
    zh: "伤害相关弹震效果系数"
    en: "Damage-dependent stun effect fraction"
    help_zh: "随伤害变化的弹震效果比例，范围 0 到 1。"
    help_en: "Damage-dependent stun-effect fraction, from zero to one."
  boostStartTime:
    zh: "再装填加速开始时间"
    en: "Autoreload boost start"
    help_zh: "原生改进型再装填开始计算加速的时间阈值。"
    help_en: "Time threshold for the existing autoreload boost to begin."
  boostResidueTime:
    zh: "再装填加速剩余时间"
    en: "Autoreload boost residue"
    help_zh: "原生再装填加速逻辑的剩余时间参数，不能为负数。"
    help_en: "Residual time parameter of the existing autoreload boost; nonnegative."
  boostFraction:
    zh: "再装填加速比例"
    en: "Autoreload boost fraction"
    help_zh: "原生再装填加速的比例系数，范围 0 到 1。"
    help_en: "Boost fraction for the existing autoreload mechanism, from zero to one."
  speedThreshold:
    zh: 直驱增压速度阈值
    en: Direct-drive speed threshold
    help_zh: 客户端判定直驱增压条件所用的速度阈值，按原始单位保存。
    help_en: Speed threshold used by the native direct-drive mechanic, in client units.
  modeThreshold:
    zh: 直驱模式激活阈值
    en: Direct-drive activation threshold
    help_zh: 当前直驱模式的激活阈值，保留客户端原始尺度。
    help_en: Activation threshold for the existing direct-drive mechanic in its original scale.
  modeDuration:
    zh: 直驱模式持续参数
    en: Direct-drive duration
    help_zh: 原生直驱模式的持续时间参数。
    help_en: Native duration parameter of the direct-drive mechanic.
  accelerationFactor:
    zh: 直驱模式累积倍率
    en: Direct-drive accumulation factor
    help_zh: 原生直驱模式的累积系数，按当前客户端定义保存。
    help_en: Native accumulation factor for the direct-drive mechanic.
  attenuationFactor:
    zh: 直驱模式衰减倍率
    en: Direct-drive attenuation factor
    help_zh: 原生直驱模式的衰减系数，按当前客户端定义保存。
    help_en: Native attenuation factor for the direct-drive mechanic.
  vehicleSpeed:
    zh: 机制车速倍率
    en: Mechanic vehicle-speed multiplier
    help_zh: 模式启用时的车速倍率；1.35 表示基础值的 1.35 倍。
    help_en: Vehicle-speed multiplier while the mode is active; 1.35 means 1.35 times the base value.
  dispersion:
    zh: 机制散布倍率
    en: Mechanic dispersion multiplier
    help_zh: 模式启用时的火炮散布倍率，越大通常散布越大。
    help_en: Gun dispersion multiplier while the mode is active; larger generally worsens dispersion.
