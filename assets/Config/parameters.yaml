field_overrides:
  - field: enginePower
    contains: /mechanics/
    zh: 机制发动机功率倍率
    en: Mechanic engine-power multiplier
    help_zh: 当前机制启用时对基础发动机功率施加的倍率，1.36 表示基础功率的 1.36 倍，不是 1.36 马力。
    help_en: Base engine-power multiplier while the mechanic is active; 1.36 means 1.36 times power, not horsepower.
  - field: rotationSpeed
    contains: /mechanics/
    zh: 机制车体转向倍率
    en: Mechanic hull-rotation multiplier
    help_zh: 当前机制启用时的车体转向速度倍率，0.7 表示基础转速的 70%。
    help_en: Hull-rotation speed multiplier while the mechanic is active; 0.7 means 70% of the base speed.
  - field: maxHealth
    suffix: /hull/maxHealth
    zh: "车体基础生命值"
    en: "Hull base hitpoints"
    help_zh: "车辆生命值的车体贡献部分；最终生命值还可能加上所装炮塔的 maxHealth。"
    help_en: "Hull contribution to vehicle hitpoints; the installed turret can contribute additional maxHealth."
  - field: maxHealth
    contains: /ammoBayHealth/
    zh: "弹药架模块血量"
    en: "Ammo-rack module health"
    help_zh: "弹药架模块的最大生命值，影响该模块被击伤或击毁的判定。"
    help_en: "Maximum ammo-rack module health, affecting damage and destruction thresholds."
  - field: maxHealth
    contains: /turretRotatorHealth/
    zh: "炮塔座圈模块血量"
    en: "Turret-ring module health"
    help_zh: "炮塔旋转机构的模块生命值，不是整车生命值贡献。"
    help_en: "Health of the turret rotation mechanism, separate from vehicle hitpoints."
  - field: maxHealth
    contains: /surveyingDeviceHealth/
    zh: "观察装置模块血量"
    en: "Observation-device module health"
    help_zh: "观察装置被击伤或损毁前的模块生命值。"
    help_en: "Observation-device module health before damage or destruction."
  - field: maxHealth
    category: chassis
    zh: "悬挂模块血量"
    en: "Suspension module health"
    help_zh: "当前悬挂的模块生命值，影响断履带及悬挂损伤判定。"
    help_en: "Health of the current suspension module, affecting track damage."
  - field: maxHealth
    category: turret
    zh: "炮塔生命值贡献"
    en: "Turret hitpoint contribution"
    help_zh: "所装炮塔对整车生命值的贡献，需与车体基础生命值一起检查。"
    help_en: "Installed turret contribution to vehicle hitpoints; inspect the hull base hitpoints too."
  - field: maxHealth
    category: engine
    zh: "发动机模块血量"
    en: "Engine module health"
    help_zh: "发动机模块的最大生命值，影响受损和损毁判定。"
    help_en: "Maximum engine module health, affecting damage and destruction thresholds."
  - field: maxHealth
    category: gun
    zh: "火炮模块血量"
    en: "Gun module health"
    help_zh: "火炮模块的最大生命值，影响火炮受损和损毁判定。"
    help_en: "Maximum gun module health, affecting gun damage and destruction."
  - field: reloadTime
    contains: /autoreload/
    zh: "自动再装填逐发时间"
    en: "Autoreload per-round times"
    help_zh: "各发炮弹对应的装填时长向量，必须保持原有长度与顺序。"
    help_en: "Per-round reload-duration vector; preserve its original length and order."
  - field: level
    category: chassis
    zh: "悬挂模块等级"
    en: "Suspension module tier"
    help_zh: "模块的研发／技术等级，不会改变车辆分房等级。"
    help_en: "Research/technical tier of this module, separate from vehicle matchmaking tier."
  - field: level
    category: gun
    zh: "火炮模块等级"
    en: "Gun module tier"
    help_zh: "火炮模块的技术等级，不会改变车辆等级。"
    help_en: "Technical tier of the gun module, separate from vehicle tier."
  - field: level
    category: engine
    zh: "发动机模块等级"
    en: "Engine module tier"
    help_zh: "发动机模块的技术等级，不会改变车辆等级。"
    help_en: "Technical tier of the engine module, separate from vehicle tier."
  - field: level
    category: turret
    zh: "炮塔模块等级"
    en: "Turret module tier"
    help_zh: "炮塔模块的技术等级，不会改变车辆等级。"
    help_en: "Technical tier of the turret module, separate from vehicle tier."

presentation:
  modifier_multiplier:
    zh: 倍率
    en: ' multiplier'
    help_zh: 现有特殊机制对该属性施加的倍率。1 表示不变，1.4 表示基础值的 140%。原始属性地址见下方路径；不改变机制结构。
    help_en: Multiplier applied by the existing mechanic; 1 leaves the base value unchanged and 1.4 means 140% of it. The native attribute is identified by its source path.
  modifier_addition:
    zh: 增量
    en: ' addition'
    help_zh: 现有特殊机制对该属性施加的原始增量。0 表示不额外增加；单位沿用客户端该属性，不改变机制结构。
    help_en: Raw additive adjustment applied by the existing mechanic. Zero adds nothing; units follow the native attribute.
  angle_nodes:
    zh: ' 个方向节点'
    en: ' direction nodes'
  shot_interval:
    zh: 短装填时间（秒）
    en: Intra-magazine interval (s)
    help_zh: 弹匣或连发机制相邻两发之间的时间。编辑器自动换算原始 rate，数值越小射击越快。
    help_en: Time between rounds in the existing magazine or burst. Converted automatically to the client rate; lower fires faster.
  magazine_reload:
    zh: 长装填时间（秒）
    en: Full magazine reload (s)
  total_autoreload:
    zh: 补满弹匣总时间（秒）
    en: Total sequential reload (s)
    help_zh: 当前逐发装填时间之和。修改时按比例调整各发时间，保留数量和顺序；下方仍可单独修改原始逐发时间。
    help_en: Sum of existing per-round reload times. Editing scales those times proportionally while preserving count and order.
  elevation:
    zh: 仰角（度）
    en: Gun elevation (degrees)
    help_zh: 通常填写正数仰角；特殊受限区段可能是负值。编辑器反转 minPitch 的原始符号，只修改对应角度组，保持方位坐标及其他区段不变。
    help_en: Elevation is normally positive; restricted regions can be negative. Reverses the native minPitch sign and updates only this angle group, preserving direction coordinates.
  depression:
    zh: 俯角（度）
    en: Gun depression (degrees)
    help_zh: 只修改 maxPitch 的对应角度组，保持方位坐标和其他区段不变。多个 5 度可一次改为 7 度；负俯角表示该区段炮口必须抬高，负号会原样保留。
    help_en: Updates this maxPitch angle group while preserving coordinates and other regions. Negative depression means the gun must point upward in that region; its sign is preserved.
